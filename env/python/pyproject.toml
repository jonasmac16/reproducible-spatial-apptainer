[project]
name = "scientific-base"
version = "1.0.0"
description = "Compact R/Python scientific development profile"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "packaging",
  "jupyterlab",
  "ipykernel",
  "rpy2",

  # Dataset and container provenance
  "datalad",
  "datalad-metalad",
  "datalad-container",
]

[tool.uv]
package = false
